name: Release

# Builds a signed Release APK when a version tag (v2.1.0) is pushed and drafts a GitHub release.
#
# Distribution is by direct download / internal testing only: Xamarin.Android ends at targetSdk 33,
# Google Play requires a higher one (docs/ARCHITECTURE.md, ADR 1).
#
# Without signing secrets (forks, or before anybody uploaded a keystore) the release job reports
# "skipped" instead of failing. CI keeps producing installable APKs either way.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version name (e.g. 2.1.0)
        required: true

permissions:
  contents: write

jobs:
  guard:
    name: Run only on GitHub with signing secrets
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      # Secrets cannot be read in a job-level "if:", so their presence becomes an output here.
      - id: check
        env:
          SERVER_URL: ${{ github.server_url }}
          IS_FORK: ${{ github.event.repository.fork }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          reason=''
          if [ -n "${ACT:-}" ]; then reason='local runner (act)'
          elif [ "$SERVER_URL" != 'https://github.com' ]; then reason="server $SERVER_URL"
          elif [ "$IS_FORK" = 'true' ]; then reason='fork'
          elif [ -z "$KEYSTORE" ]; then reason='no ANDROID_KEYSTORE_BASE64 secret configured'
          fi
          if [ -n "$reason" ]; then
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release skipped: $reason."
          else
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Signed Android release
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-xamarin-android

      # The tag is the single source of the version name (v2.1.0 -> 2.1.0); the monotonic run number
      # is the version code, so two builds can never claim the same code.
      - name: Set version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $name = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME -replace '^v', '' }
          ./scripts/Set-AndroidVersion.ps1 -VersionCode ${{ github.run_number }} -VersionName $name
          "name=$name" >> $env:GITHUB_OUTPUT

      # Written outside the checkout so that no later step can commit it by accident.
      - name: Restore keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/release.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      # Passwords are handed over as env:NAME, so they never appear on a command line or in a log.
      - name: Build signed APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: >
          msbuild src/Waldmann.Android/Waldmann.Android.csproj
          /restore
          /t:SignAndroidPackage
          /p:Configuration=Release
          /p:JavaSdkDirectory="$env:JAVA_HOME"
          /p:AndroidSdkDirectory="$env:ANDROID_SDK_ROOT"
          /p:AndroidSigningKeyStore="$env:RUNNER_TEMP/release.keystore"
          /p:AndroidSigningKeyAlias="$env:ANDROID_KEY_ALIAS"
          /p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          /p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          /nologo /v:m

      - name: Upload release artefact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}
          path: src/Waldmann.Android/bin/Release/*-Signed.apk
          if-no-files-found: error

      # Draft, not published: somebody reviews the notes before the download is offered.
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: src/Waldmann.Android/bin/Release/*-Signed.apk
